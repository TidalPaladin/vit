name: Dependency health
run-name: Dependency health ${{ inputs.validation_id || github.run_id }}

"on":
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      validation_id:
        description: Correlation UUID for exact-run validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-health
  cancel-in-progress: false

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.15"
          enable-cache: true
          restore-cache: true
          save-cache: true
          cache-dependency-glob: |-
            pyproject.toml
            uv.lock
          cache-suffix: ubuntu-x64-uv-0.13.7-python-3.15-torch-2.15.0-security
      - name: Verify pinned tools
        run: |
          test "$(uv --version | cut -d ' ' -f 1-2)" = "uv 0.13.7"
          uv run --no-project --python 3.15 python -c 'import sys; assert sys.version_info[:2] == (3, 15)'
      - name: Install locked security tools
        run: uv sync --frozen --only-group ci-security --python 3.15
      - name: Run every security scanner
        id: security
        continue-on-error: true
        run: |
          uv run --frozen --no-sync --only-group ci-security \
            python tools/run_security_audit.py --report-dir dependency-security
      - name: Summarize security audit
        if: ${{ always() }}
        run: |
          {
            echo "## Dependency security audit"
            echo
            echo '```json'
            cat dependency-security/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-${{ github.run_id }}
          path: dependency-security/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce security result
        if: ${{ always() }}
        env:
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: test "$SECURITY_OUTCOME" = success

  deprecation-report:
    name: Deprecation report
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.15"
          enable-cache: true
          restore-cache: true
          save-cache: true
          cache-dependency-glob: |-
            pyproject.toml
            uv.lock
          cache-suffix: ubuntu-x64-uv-0.13.7-python-3.15-torch-2.15.0-dependency-report
      - name: Verify pinned tools
        run: |
          test "$(uv --version | cut -d ' ' -f 1-2)" = "uv 0.13.7"
          uv run --no-project --python 3.15 python -c 'import sys; assert sys.version_info[:2] == (3, 15)'
      - name: Install locked reporting tools
        run: uv sync --frozen --only-group ci-dependency-report --python 3.15
      - name: Build dependency report
        run: make report-deprecations REPORT_DIR=dependency-deprecations
      - name: Install locked test dependencies
        run: uv sync --frozen --all-groups --python 3.15
      - name: Run tests with deprecation warnings
        run: |
          set -o pipefail
          make test-deprecations 2>&1 | tee dependency-deprecations/deprecation-warnings.log
      - name: Add dependency report to summary
        if: ${{ always() }}
        run: cat dependency-deprecations/dependency-deprecations.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dependency reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-deprecations-${{ github.run_id }}
          path: dependency-deprecations/
          if-no-files-found: error
          retention-days: 7
