name: CI

"on":
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.15"
          enable-cache: true
          restore-cache: true
          save-cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-dependency-glob: |-
            pyproject.toml
            uv.lock
          cache-suffix: ubuntu-x64-uv-0.13.7-python-3.15-torch-2.15.0
      - name: Verify pinned tools
        env:
          PYTHON_VERSION: "3.15"
        run: |
          test "$(uv --version | cut -d ' ' -f 1-2)" = "uv 0.13.7"
          uv python install "$PYTHON_VERSION"
          uv run --no-project --python "$PYTHON_VERSION" python -c \
            'import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))'
      - name: Install locked dependencies
        env:
          PYTHON_VERSION: "3.15"
        run: uv sync --frozen --all-groups --python "$PYTHON_VERSION"
      - name: Verify runtime versions
        env:
          PYTHON_VERSION: "3.15"
          TORCH_VERSION: "2.15.0"
          TORCHAO_VERSION: "0.18.0"
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.metadata
          import os
          import sys

          assert sys.version_info[:2] == tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))
          assert importlib.metadata.version("torch").partition("+")[0] == os.environ["TORCH_VERSION"]
          assert importlib.metadata.version("torchao") == os.environ["TORCHAO_VERSION"]
          PY
      - name: Check formatting and lint
        run: make quality
      - name: Check types
        run: make types

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            artifact-suffix: py311
          - python-version: "3.14"
            artifact-suffix: py314
          - python-version: "3.15"
            artifact-suffix: py315
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          restore-cache: true
          save-cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-dependency-glob: |-
            pyproject.toml
            uv.lock
          cache-suffix: ubuntu-x64-uv-0.13.7-python-${{ matrix.python-version }}-torch-2.15.0
      - name: Verify pinned tools
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          test "$(uv --version | cut -d ' ' -f 1-2)" = "uv 0.13.7"
          uv python install "$PYTHON_VERSION"
          uv run --no-project --python "$PYTHON_VERSION" python -c \
            'import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))'
      - name: Install locked dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --frozen --all-groups --python "$PYTHON_VERSION"
      - name: Verify runtime versions
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          TORCH_VERSION: "2.15.0"
          TORCHAO_VERSION: "0.18.0"
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.metadata
          import os
          import sys

          assert sys.version_info[:2] == tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))
          assert importlib.metadata.version("torch").partition("+")[0] == os.environ["TORCH_VERSION"]
          assert importlib.metadata.version("torchao") == os.environ["TORCHAO_VERSION"]
          PY
      - name: Run CPU tests
        run: make test-ci
      - name: Validate distribution
        run: make check-distribution
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.artifact-suffix }}-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TESTS_RESULT" = success
