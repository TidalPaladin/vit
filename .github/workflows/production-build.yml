name: Production build
run-name: Production build ${{ inputs.validation_id || github.run_id }}

"on":
  schedule:
    - cron: "37 5 * * 0"
  workflow_dispatch:
    inputs:
      validation_id:
        description: Correlation UUID for exact-run validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  distributions:
    name: Distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.15"
          enable-cache: true
          restore-cache: true
          save-cache: true
          cache-dependency-glob: |-
            pyproject.toml
            uv.lock
          cache-suffix: ubuntu-x64-uv-0.13.7-python-3.11-3.15-torch-2.15.0-production
      - name: Verify pinned tools and Python boundaries
        run: |
          test "$(uv --version | cut -d ' ' -f 1-2)" = "uv 0.13.7"
          uv python install 3.11 3.15
          uv run --no-project --python 3.11 python -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          uv run --no-project --python 3.15 python -c 'import sys; assert sys.version_info[:2] == (3, 15)'
      - name: Build source distributions
        run: uv build --no-sources --wheel --sdist --out-dir dist
      - name: Rebuild wheel from sdist
        run: |
          sdist_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$sdist_path"
          mkdir rebuilt
          uv build --no-sources --wheel --out-dir rebuilt "$sdist_path"
      - name: Validate console scripts in both wheels
        run: uv run --no-project --python 3.15 python tools/validate_wheel.py dist/*.whl rebuilt/*.whl
      - name: Clean-install and smoke-test distributions
        env:
          SOURCE_ENV: ${{ runner.temp }}/vit-source-wheel
          REBUILT_ENV: ${{ runner.temp }}/vit-rebuilt-wheel
        run: |
          uv venv --python 3.11 "$SOURCE_ENV"
          uv pip install --python "$SOURCE_ENV/bin/python" dist/*.whl
          uv venv --python 3.15 "$REBUILT_ENV"
          uv pip install --python "$REBUILT_ENV/bin/python" rebuilt/*.whl

          "$SOURCE_ENV/bin/python" -c \
            'import importlib.metadata, sys; assert sys.version_info[:2] == (3, 11); assert importlib.metadata.version("torch").partition("+")[0] == "2.15.0"; assert importlib.metadata.version("torchao") == "0.18.0"'
          "$REBUILT_ENV/bin/python" -c \
            'import importlib.metadata, sys; assert sys.version_info[:2] == (3, 15); assert importlib.metadata.version("torch").partition("+")[0] == "2.15.0"; assert importlib.metadata.version("torchao") == "0.18.0"'

          for command in vit-benchmark vit-component-benchmark vit-explain; do
            "$SOURCE_ENV/bin/$command" --help
            "$REBUILT_ENV/bin/$command" --help
          done
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vit-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  cpu-compile:
    name: CPU compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.15"
          enable-cache: true
          restore-cache: true
          save-cache: true
          cache-dependency-glob: |-
            pyproject.toml
            uv.lock
          cache-suffix: ubuntu-x64-uv-0.13.7-python-3.15-torch-2.15.0-compile
      - name: Verify pinned tools
        run: test "$(uv --version | cut -d ' ' -f 1-2)" = "uv 0.13.7"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --python 3.15
      - name: Verify CPU runtime
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.metadata
          import sys
          import torch

          assert sys.version_info[:2] == (3, 15)
          assert importlib.metadata.version("torch").partition("+")[0] == "2.15.0"
          assert importlib.metadata.version("torchao") == "0.18.0"
          assert not torch.cuda.is_available()
          PY
      - name: Run CPU compile tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          TORCHDYNAMO_DISABLE: "0"
        run: make test-compile-cpu
