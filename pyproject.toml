[build-system]
requires = ["hatchling==1.31.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "vit"
description = ""
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Scott Chase Waggener", email = "chase.waggener@icloud.com"},
]
dependencies = [
  "torch==2.13.0",
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.1; python_version >= '3.12'",
  "pyyaml==6.0.3",
  "torchao==0.17.0",
]

readme = "README.md"
license = {text = "Apache"}
dynamic = ["version"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = false
combine-as-imports = true

[tool.basedpyright]
include = ["vit", "tests", "benchmark", "tools", "examples"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.pytest_cache",
  "**/_version.py",
]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.uv]
required-version = "==0.11.28"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "vit/_version.py"

[tool.pytest.ini_options]
markers = [
  "compile",
  "cuda",
]
filterwarnings = []

[project.scripts]
vit-benchmark = "benchmark.cli:main"
vit-component-benchmark = "benchmark.component_cli:main"
vit-explain = "vit.explain.cli:main"

[project.optional-dependencies]
benchmarking = [
    "matplotlib==3.11.0",
    "tqdm==4.68.4",
]
explainability = [
    "captum==0.9.0",
    "matplotlib==3.11.0",
    "pillow==12.3.0",
]

[dependency-groups]
benchmarking = [
    "matplotlib==3.11.0",
    "tqdm==4.68.4",
]
explainability = [
    "captum==0.9.0",
    "matplotlib==3.11.0",
    "pillow==12.3.0",
]

dev = [
    "ruff==0.15.21",
    "basedpyright==1.39.9",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "pytest-env==1.6.0",
    "coverage==7.15.0",
    "pdbpp==0.12.1",
    {include-group = "benchmarking"},
    {include-group = "explainability"},
]

ci-security = [
    "pip-audit==2.10.1",
    "zizmor==1.28.0",
]

ci-dependency-report = [
    "packaging==26.2",
]

[tool.hatch.build.targets.wheel]
packages = ["vit", "benchmark"]
